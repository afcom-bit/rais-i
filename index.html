<style>

function reset(){var e=[t1,dot];items.forEach(function(it){e.push(it.t,it.line);it.chars.forEach(function(c){c.classList.remove('on','cur')})});e.forEach(function(x){x.getAnimations().forEach(function(a){a.cancel()})})}

async function typed(it,ok){
  await fx(it.t,[{opacity:1},{opacity:1}],1);
  var per=sec('--type-per',.11),last=it.chars.length-1;
  for(var i=0;i<=last;i++){if(i)it.chars[i-1].classList.remove('cur');it.chars[i].classList.add('on','cur');await wait(per);if(!ok())return false}
  it.chars[last].classList.remove('cur');
  await wait(sec(it.hold,3.5));if(!ok())return false;
  await fx(it.t,[{opacity:1},{opacity:.08},{opacity:1}],sec('--type-blink',1.2),{iterations:nb()});if(!ok())return false;
  var cut=sec('--type-collapse',1.2);
  fx(it.line,[{opacity:0},{opacity:1}],cut*.8,{delay:cut*.2});
  await fx(it.t,[{transform:'scaleY(1)',opacity:1,offset:0},{opacity:1,offset:.6},{transform:'scaleY(.03)',opacity:0,offset:1}],cut);if(!ok())return false;
  await fx(it.line,[{opacity:1,transform:'scaleX(1)'},{opacity:0,transform:'scaleX(0)'}],sec('--type-fade',1.6),{easing:'ease-in'});
  return ok()}

async function cycle(my){
  var ok=function(){return my===run};reset();
  var dIn=sec('--dot-in',.7);
  await fx(dot,[{opacity:0,transform:'scale(0)'},{opacity:1,transform:'scale(1)'}],dIn,{easing:'ease-out'});if(!ok())return;
  await wait(sec('--dot-hold',.4));if(!ok())return;
  var g=sec('--rais-grow',2.4);
  fx(dot,[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(2.2)'}],g*.5);
  await fx(t1,[{opacity:0,transform:'scale(.06)',offset:0},{opacity:1,offset:.45},{opacity:1,transform:'scale(1)',offset:1}],g,{easing:'cubic-bezier(.25,.8,.3,1)'});if(!ok())return;
  await wait(sec('--rais-hold',3.5));if(!ok())return;
  await fx(t1,[{opacity:1},{opacity:.08},{opacity:1}],sec('--rais-blink',1.2),{iterations:nb()});if(!ok())return;
  var s=sec('--rais-shrink',2);
  fx(dot,[{opacity:0,transform:'scale(2.2)'},{opacity:1,transform:'scale(1)'}],s*.5,{delay:s*.5});
  await fx(t1,[{opacity:1,transform:'scale(1)',offset:0},{opacity:1,offset:.55},{opacity:0,transform:'scale(.06)',offset:1}],s);if(!ok())return;
  await fx(dot,[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(0)'}],dIn);if(!ok())return;
  for(var k=0;k<items.length;k++){await wait(sec('--type-gap',.5));if(!ok())return;if(!(await typed(items[k],ok)))return}
  await wait(sec('--loop-pause',1.5))}
async function loop(my){while(my===run)await cycle(my)}

/* Mode (tombol kiri), info (tombol bulat), ukuran (tombol kanan: kecil > normal > besar) */
function setMode(m){var t=m==='txt';cl.toggle('rais-m-txt',t);cl.toggle('rais-m-led',!t);lb(bm,t?'Tampilkan LED':'Tampilkan teks RAIS');run++;reset();if(!t)return;if(rm)t1.style.opacity=1;else loop(run)}
function setInfo(v){clearTimeout(tm);cl.toggle('rais-info-on',v);bi.setAttribute('aria-pressed',v?'true':'false');var s=parseFloat(cs.getPropertyValue('--info-time'));if(v&&s>0)tm=setTimeout(function(){setInfo(false)},s*1000)}
function setSize(n,now){sz=n;if(now)p.style.transition='none';cl.toggle('rais-min',n===0);cl.toggle('rais-big',n===2);lb(bn,['Ukuran normal','Perbesar player','Perkecil player'][n]);if(n===0)setInfo(false);if(now){void p.offsetWidth;p.style.transition=''}}

var s0=parseInt(ld('rais-size'),10),md=ld('rais-mode'),dm=at('data-mode','teks'),ds=SZ.indexOf(at('data-size','normal'));
setSize(s0>=0&&s0<=2?s0:ds<0?1:ds,true);
setMode(md==='led'||md==='txt'?md:dm==='led'?'led':'txt');

bm.addEventListener('click',function(){var n=cl.contains('rais-m-txt')?'led':'txt';setMode(n);sv('rais-mode',n)});
bn.addEventListener('click',function(){var n=(sz+1)%3;setSize(n);sv('rais-size',n)});
bi.addEventListener('click',function(){if(sz===0){setSize(1);sv('rais-size',1)}setInfo(!cl.contains('rais-info-on'))});
})();
</script>
