<style>
/* ===== PENGATURAN ===== */
.rais-player{
  /* Ukuran & crop (px) */
  --iframe-w:360px; --iframe-h:467px;
  --crop-x:34px;            /* kiri = kanan */
  --crop-top:200px; --crop-bottom:2px;

  --cut-mask-bottom:9px;    /* potong bawah topeng */
  --mask-add-top:30px;      /* tambah tinggi topeng ke atas */
  --mask-add-bottom:0px;    /* tambah tinggi topeng ke bawah */
  --gap-top:19px;           /* jarak ke tepi atas layar */
  --shift-x:0px;            /* geser kiri (-) / kanan (+) */
  --z:99999;

  /* Skala IFRAME saja (topeng, lubang, ring, tombol tidak ikut berubah) */

  --if-origin-x:calc(var(--iframe-w)/2);   /* titik tumpu skala, dari kiri iframe */
  --if-origin-y:calc(var(--circle-y) + var(--circle-size)/2 + var(--crop-top));  /* dari atas iframe (bawaan: tombol play) */
  --if-shift-x:0px; --if-shift-y:0px;      /* geser isi iframe: kiri (-) / kanan (+), atas (-) / bawah (+) */

  /* Topeng & lubang */
  --mask-opacity:1; --r-top:35px; --r-bottom:36px;
  /* LENGKUNG CEMBUNG garis luar (px): 0 = datar. Tiap sisi sendiri; makin besar makin melengkung ke luar di tengah sisi */
  --curve-top:3px; --curve-bottom:5px; --curve-left:0px; --curve-right:0px;
  --hole1-w:280px; --hole1-h:207px; --hole1-y:-9px; --hole1-r:16px;
  --circle-size:35px; --circle-y:209px;
  --cover-color:#faf6ed; --cover-h:46px; /* tinggi penutup teks animasi (tumbuh ke atas); tambah bila teks terpotong */

  /* Ring & tombol */
  --ring-gap:6px; --cap-x:60px; --cap-h:30px; --btn-h:27px; --btn-start:15px; --cut-gap:3px; --ico-size:19px;

  /* Teks info (menutup penuh lubang atas) */
  --info-size:11px; --info-sx:1; --info-y:0px; --info-weight:600; --info-lh:1.35; --info-fade:.6s;
  --info-title-size:13px; --info-title-weight:700; --info-gap:4px; --info-pad:8px; --info-align:center;
  --info-time:12;           /* detik tampil lalu kembali ke mode sebelumnya; 0 = tetap sampai tombol kiri ditekan lagi */

  /* Teks animasi */
  --txt-font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --speed:1;                /* pengali semua animasi */
  --blink-n:1; --line-h:1px;
  --rais-size:29px; --rais-sx:1; --rais-y:-10px; /* posisi RAIS: minus = naik, plus = turun */ --rais-weight:800; --rais-spacing:.22em; --dot-size:5px;
  --name-size:15px; --name-sx:1; --name-y:-8px; --name-weight:600; --name-spacing:.02em;
  --sub-size:12px;  --sub-sx:1;  --sub-y:-8px;  --sub-weight:600;  --sub-spacing:.02em;

  /* Waktu animasi (detik, sebelum dikali --speed) */
  --dot-in:.2; --dot-hold:.1; --rais-grow:2.4; --rais-hold:5.5; --rais-blink:3.2; --rais-shrink:2;
  --type-per:.11; --name-hold:7.5; --sub-hold:3.5; --type-blink:1.2; --type-collapse:1.2; --type-fade:1.6; --type-gap:.5; --loop-pause:1.5;

  /* LED */
  --led-opacity:.3; --led-glow:2px; --led-h:44px; --led-gap:6px; --led-pad:13px; --led-speed:.9s; --led-segment:4.5px; --led-lit:4px;

  /* Warna */

  --btn-lo:#030000; --btn-hi:#250101ec; --btn-edge:#585858; --ico-color:#bbbbbb;
  --rais-color:rgb(2, 71, 46); --name-color:#023d27; --sub-color:#023d27;
  --info-color:#140000; --info-title-color:#106100;
  --led-color:#af0000;
}

position:fixed;top:calc(var(--gap-top) + var(--mask-add-top));left:50%;margin:0 0 0 calc(var(--shift-x) - var(--pw)/2);width:var(--pw);height:var(--ph);line-height:0;clip-path:inset(calc(var(--mask-add-top)*-1) 0 calc(var(--mask-add-bottom)*-1) 0 round var(--r));z-index:var(--z);pointer-events:none}

.rais-player .rais-infotxt{display:block;color:var(--info-color);font-size:var(--info-size);font-weight:var(--info-weight);line-height:var(--info-lh);transform:translateY(var(--info-y)) scaleX(var(--info-sx))}
.rais-player .rais-info-t{display:block;color:var(--info-title-color);font-size:var(--info-title-size);font-weight:var(--info-title-weight);margin-bottom:var(--info-gap)}
.rais-player .rais-info-t:empty{display:none}
.rais-player .rais-info-b{display:block;white-space:pre-line}

.rais-player .rais-ring{position:absolute;left:calc(var(--circle-x) - var(--ring-gap));top:calc(var(--circle-y) - var(--ring-gap));width:var(--ring-d);height:var(--ring-d);border-radius:50%;border:2px solid rgba(var(--ring-color),.9);box-shadow:0 0 0 1px var(--edge)}
.rais-player .rais-cap{position:absolute;left:var(--cap-x);right:var(--cap-x);top:calc(var(--row-y) - var(--cap-h)/2);height:var(--cap-h);filter:drop-shadow(1px 0 0 var(--edge)) drop-shadow(-1px 0 0 var(--edge)) drop-shadow(0 1px 0 var(--edge)) drop-shadow(0 -1px 0 var(--edge))}
.rais-player .rais-cap::before{content:"";position:absolute;inset:0;border:1px solid rgba(var(--ring-color),.9);border-radius:var(--cap-h);-webkit-mask-image:radial-gradient(circle at 50% 50%,transparent calc(var(--ring-d)/2 - 1px),#000 calc(var(--ring-d)/2 - .4px));mask-image:radial-gradient(circle at 50% 50%,transparent calc(var(--ring-d)/2 - 1px),#000 calc(var(--ring-d)/2 - .4px))}
.rais-player .rais-side{position:absolute;top:calc(var(--row-y) - var(--btn-h)/2);height:var(--btn-h)}

.rais-player .rais-btn{--m:radial-gradient(circle at var(--cx) 50%,transparent var(--cut-r),#000 calc(var(--cut-r) + .6px));--m2:radial-gradient(circle at calc(var(--cx) + var(--d)) 50%,transparent calc(var(--cut-r) + 1px),#000 calc(var(--cut-r) + 1.6px));position:absolute;inset:0;margin:0;padding:0;border:0;font-size:0;line-height:0;background:var(--btn-edge);border-radius:var(--rl) var(--rr) var(--rr) var(--rl);-webkit-mask-image:var(--m);mask-image:var(--m);-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer;pointer-events:auto}

<!-- TEKS: ubah data-text1/2/3 (| = baris baru) dan data-info (baris pertama = judul, &#10; = baris baru).
     data-mode = led | teks (tampilan awal). data-led = jumlah bar.
     SHARE WA: data-share-text = teks pesan; data-share-url = link yang dibagikan (kosong = alamat halaman ini).
     Tombol kiri berganti: LED > teks RAIS > info. Tombol kanan = share WhatsApp.
     Perbesar/perkecil isi iframe: ubah --if-scale di blok PENGATURAN. -->
<div class="rais-player rais-m-led" id="rais-player" data-mode="teks" data-led="10"
  data-text1="RAIS"
  data-text2="Radio Islam Sragen"
  data-text3="Lantunan Muratal|dan Kajian Islam Ilmiah"
  data-info="Selamat Datang di Aplikasi Radio Islam Sragen&#10;Media dakwah Islam penyejuk hati. Menghadirkan lantunan murattal dan kajian sunnah 24 jam nonstop untuk menemani aktivitas Anda"
  data-share-text="Dengarkan Radio Islam Sragen, lantunan murattal dan kajian sunnah 24 jam nonstop:"
  data-share-url="">
  <div class="rais-fwrap"><iframe class="rais-frame" src="https://player.radioislam.or.id/e/radio/RadioIslamSragen?theme=rii&amp;mode=player" scrolling="no" frameborder="0" width="320" height="400" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" title="Radio Islam Sragen"></iframe></div>
  <div class="rais-cover">
    <div class="rais-txt">
      <div class="rais-pos rais-pos1"><span class="rais-wrap"><i class="rais-dot"></i><span class="rais-t1"></span></span></div>
      <div class="rais-pos rais-pos2 rais-typed"><span class="rais-wrap"><span class="rais-tt"></span><i class="rais-line"></i></span></div>
      <div class="rais-pos rais-pos3 rais-typed"><span class="rais-wrap"><span class="rais-tt"></span><i class="rais-line"></i></span></div>
    </div>
    <div class="rais-infobox"><span class="rais-infotxt"><b class="rais-info-t"></b><span class="rais-info-b"></span></span></div>
  </div>
  <div class="rais-mask"><div class="rais-hole rais-hole1"></div><div class="rais-hole rais-hole3"></div></div>
  <div class="rais-ui">
    <span class="rais-cap"></span>
    <span class="rais-ring"></span>
    <div class="rais-side rais-side-l"><button type="button" class="rais-btn rais-b-mode"><span class="rais-ico"></span></button></div>
    <div class="rais-side rais-side-r"><button type="button" class="rais-btn rais-b-share" aria-label="Bagikan via WhatsApp" title="Bagikan via WhatsApp"><span class="rais-ico"></span></button></div>
  </div>
  <div class="rais-leds"></div>
</div>

<script>
(function(){

center();addEventListener('resize',center);

/* Bentuk luar: sudut membulat + lengkung cembung tiap sisi (atas, bawah, kiri, kanan) */
var mk=q('.rais-mask');
function nv(n){return parseFloat(cs.getPropertyValue(n))||0}
function shape(x0,y0,x1,y1,rt,rb,ct,cb,cl,cr){
  var K=.5523,mx=(x0+x1)/2,my=(y0+y1)/2,

  brx=Math.max(rb,cr),bry=Math.max(rb,cb),blx=Math.max(rb,cl),bly=Math.max(rb,cb),

/* Animasi teks (waktu dibaca dari CSS, detik / --speed) */
function sec(n,d){var v=parseFloat(cs.getPropertyValue(n));return(isNaN(v)?d:v)*1000/(parseFloat(cs.getPropertyValue('--speed'))||1)}
function nb(){var n=parseInt(cs.getPropertyValue('--blink-n'),10);return isNaN(n)?2:n}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function fx(el,kf,ms,o){return el.animate(kf,Object.assign({duration:ms,fill:'forwards',easing:'ease-in-out'},o||{})).finished.catch(function(){})}

async function typed(it,ok){
  await fx(it.t,[{opacity:1},{opacity:1}],1);

  for(var i=0;i<=last;i++){if(i)it.chars[i-1].classList.remove('cur');it.chars[i].classList.add('on','cur');await wait(per);if(!ok())return false}
  it.chars[last].classList.remove('cur');
  await wait(sec(it.hold,3.5));if(!ok())return false;
  await fx(it.t,[{opacity:1},{opacity:.08},{opacity:1}],sec('--type-blink',1.2),{iterations:nb()});if(!ok())return false;
  var cut=sec('--type-collapse',1.2);
  fx(it.line,[{opacity:0},{opacity:1}],cut*.8,{delay:cut*.2});

  await fx(it.line,[{opacity:1,transform:'scaleX(1)'},{opacity:0,transform:'scaleX(0)'}],sec('--type-fade',1.6),{easing:'ease-in'});
  return ok()}

async function cycle(my){
  var ok=function(){return my===run};reset();
  var dIn=sec('--dot-in',.7);
  await fx(dot,[{opacity:0,transform:'scale(0)'},{opacity:1,transform:'scale(1)'}],dIn,{easing:'ease-out'});if(!ok())return;

  var g=sec('--rais-grow',2.4);

  await fx(t1,[{opacity:0,transform:'scale(.06)',offset:0},{opacity:1,offset:.45},{opacity:1,transform:'scale(1)',offset:1}],g,{easing:'cubic-bezier(.25,.8,.3,1)'});if(!ok())return;
  await wait(sec('--rais-hold',3.5));if(!ok())return;
  await fx(t1,[{opacity:1},{opacity:.08},{opacity:1}],sec('--rais-blink',1.2),{iterations:nb()});if(!ok())return;
  var s=sec('--rais-shrink',2);
  fx(dot,[{opacity:0,transform:'scale(2.2)'},{opacity:1,transform:'scale(1)'}],s*.5,{delay:s*.5});
  await fx(t1,[{opacity:1,transform:'scale(1)',offset:0},{opacity:1,offset:.55},{opacity:0,transform:'scale(.06)',offset:1}],s);if(!ok())return;
  await fx(dot,[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(0)'}],dIn);if(!ok())return;
  for(var k=0;k<items.length;k++){await wait(sec('--type-gap',.5));if(!ok())return;if(!(await typed(items[k],ok)))return}
  await wait(sec('--loop-pause',1.5))}
